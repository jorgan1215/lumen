# LUMEN 摄影网站 —— Nginx 配置（HTTPS 版）
# 使用方法：
#   1. 把下面两处 your-domain.com 全部替换成你的真实域名
#   2. sudo cp deploy/nginx-https.conf /etc/nginx/conf.d/lumen.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 注意：3001 端口只监听 127.0.0.1，不要在防火墙放行它。

# ---------- HTTP：ACME 校验 + 全量跳 HTTPS ----------
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt 续期校验（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：主站 ----------
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL 证书（certbot 签发后自动生成的路径）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头（后台有登录，建议保留）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS：确认 HTTPS 稳定后再启用，一旦启用浏览器会强制走 HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/lumen/client/dist;
    index index.html;

    # 前端构建产物（文件名带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 首页别缓存，否则发新影集后用户看到的还是旧的
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/lumen.access.log;
    error_log  /var/log/nginx/lumen.error.log;
}
